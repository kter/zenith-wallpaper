name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Gofmt
        run: |
          out=$(gofmt -l *.go)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed (run make fmt):"
            echo "$out"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile darwin
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null .
      - name: Vet darwin
        run: GOOS=darwin GOARCH=arm64 go vet .
