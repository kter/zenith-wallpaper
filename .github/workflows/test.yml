name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile darwin
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null .
      - name: Vet darwin
        run: GOOS=darwin GOARCH=arm64 go vet .
