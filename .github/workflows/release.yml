name: Release (RPM build + Homebrew tap bump)

on:
  push:
    tags:
      - 'v*'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger linux-pkg RPM build
        env:
          TOKEN: ${{ secrets.LINUX_PKG_DISPATCH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v1.1 -> 1.1
          curl -fsSL -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kter/linux-pkg/dispatches \
            -d "{\"event_type\":\"zenith-wallpaper-release\",\"client_payload\":{\"version\":\"$VERSION\",\"ref\":\"$GITHUB_REF_NAME\"}}"
          echo "Dispatched version=$VERSION ref=$GITHUB_REF_NAME to kter/linux-pkg"

  homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Bump formula in kter/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v1.1 -> 1.1
          URL="https://github.com/kter/zenith-wallpaper/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:kter/homebrew-tap.git
          cd homebrew-tap
          sed -i -E \
            -e "s|archive/refs/tags/v[0-9.]+\.tar\.gz|archive/refs/tags/${GITHUB_REF_NAME}.tar.gz|" \
            -e "s|^(  sha256 \")[0-9a-f]+(\".*)$|\1${SHA}\2|" \
            Formula/zenith-wallpaper.rb
          git -c user.name=github-actions -c user.email=actions@github.com \
            commit -am "zenith-wallpaper ${VERSION}"
          git push
          echo "Bumped kter/homebrew-tap to ${VERSION} (sha256=${SHA})"
